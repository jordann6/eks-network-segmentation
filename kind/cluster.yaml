# Local proving ground. kind's default CNI (kindnet) is disabled so Cilium is the
# only CNI, exactly as on EKS where the VPC CNI is switched off. Two workers so
# the frontend and backend land on different nodes and the reschedule receipt
# covers cross-node traffic. The lab.node/slot label is how the manifests pin
# placement; the EKS node group sets the same label.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: netseg
networking:
  disableDefaultCNI: true
nodes:
  - role: control-plane
  - role: worker
    labels:
      lab.node/slot: a
  - role: worker
    labels:
      lab.node/slot: b
