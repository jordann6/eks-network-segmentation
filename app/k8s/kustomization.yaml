apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespaces.yaml
  - rbac.yaml
  - workloads.yaml
# kind uses the locally loaded netseg-lab:dev. On EKS, `make app` runs
# `kustomize edit set image` against the ECR URL before applying.
images:
  - name: netseg-lab
    newName: netseg-lab
    newTag: dev
